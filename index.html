<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Esra Töle — Pixel Portfolio</title>

  <meta
    name="description"
    content="Esra Töle — Landscape Architecture / Digital Spatial Practice"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="app">

    <canvas id="pixelCanvas"></canvas>

    <!-- CRT / BROKEN SCREEN LAYERS -->
    <div class="crt-noise"></div>
    <div class="crt-scanlines"></div>
    <div class="crt-vignette"></div>

    <!-- HEADER -->
    <header class="identity">
      <span>ESRA TÖLE</span>

      <span>
        LANDSCAPE ARCHITECTURE / DIGITAL SPATIAL PRACTICE
      </span>
    </header>


    <!-- INTERACTIVE PIXELS -->
    <nav
      id="pixelNodes"
      class="pixel-nodes"
      aria-label="Portfolio sections"
    ></nav>


    <!-- BOTTOM TEXT -->
    <div class="hint">
      <span class="desktop-hint">
        MOVE / EXPLORE / ENTER
      </span>

      <span class="mobile-hint">
        TOUCH / EXPLORE / ENTER
      </span>
    </div>

  </main>


  <!-- =====================================================
       POPUP
       ===================================================== -->

  <section
    id="sectionLayer"
    class="section-layer"
    aria-hidden="true"
  >

    <div
      id="sectionSurface"
      class="section-surface"
    >

      <div class="section-topbar">

        <div
          id="sectionLabel"
          class="section-label"
        >
          SECTION
        </div>

        <button
          id="closeButton"
          class="close-button"
          type="button"
          aria-label="Close"
        >
          ×
        </button>

      </div>


      <div
        id="sectionContent"
        class="section-content"
      ></div>

    </div>

  </section>


  <script src="app.js"></script>

</body>
</html>
